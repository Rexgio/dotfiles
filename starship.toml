"$schema" = 'https://starship.rs/config-schema.json'

# Sin $fill: es la causa más común del repintado roto al autocompletar
format = """
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$character"""

add_newline = true

[character]
# Carácter ASCII de ancho fijo (evita desajustes de ancho en el prompt)
success_symbol = "[>](bold #b8bb26)"
error_symbol = "[>](bold #fb4934)"

[directory]
style = "bold #83a598"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
style = "bold #d3869b"
format = "[$symbol$branch]($style) "

[git_status]
style = "#fabd2f"
format = "([$all_status$ahead_behind]($style)) "

[cmd_duration]
min_time = 2000
format = "[$duration](#928374) "

[nodejs]
symbol = " "
style = "bold #b8bb26"

[python]
symbol = " "
style = "bold #fabd2f"

[rust]
symbol = " "
style = "bold #fb4934"

[golang]
symbol = " "
style = "bold #83a598"

[docker_context]
symbol = " "
style = "bold #458588"

[package]
disabled = true
