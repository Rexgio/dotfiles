# ~/.config/alacritty/alacritty.toml

# ============================
#   SHELL (fuerza zsh siempre)
# ============================
[terminal]
shell = { program = "/usr/sbin/zsh", args = ["-l"] }

# ============================
#   VENTANA
# ============================
[window]
padding = { x = 8, y = 8 }
decorations = "full"
opacity = 1.0
dynamic_title = true

[general]
live_config_reload = true

# ============================
#   FUENTE (necesaria para iconos de Starship/tmux)
# ============================
[font]
size = 12.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

# ============================
#   CURSOR
# ============================
[cursor]
style = { shape = "Block", blinking = "On" }

# ============================
#   COLORES - GRUVBOX DARK HARD
# ============================
[colors.primary]
background = "#1d2021"
foreground = "#ebdbb2"
dim_foreground = "#a89984"
bright_foreground = "#fbf1c7"

[colors.cursor]
text = "#1d2021"
cursor = "#ebdbb2"

[colors.vi_mode_cursor]
text = "#1d2021"
cursor = "#ebdbb2"

[colors.selection]
text = "#1d2021"
background = "#ebdbb2"

[colors.search.matches]
foreground = "#1d2021"
background = "#d79921"

[colors.search.focused_match]
foreground = "#1d2021"
background = "#fabd2f"

[colors.normal]
black   = "#1d2021"
red     = "#cc241d"
green   = "#98971a"
yellow  = "#d79921"
blue    = "#458588"
magenta = "#b16286"
cyan    = "#689d6a"
white   = "#a89984"

[colors.bright]
black   = "#928374"
red     = "#fb4934"
green   = "#b8bb26"
yellow  = "#fabd2f"
blue    = "#83a598"
magenta = "#d3869b"
cyan    = "#8ec07c"
white   = "#ebdbb2"

[colors.dim]
black   = "#1d2021"
red     = "#9d0006"
green   = "#79740e"
yellow  = "#b57614"
blue    = "#076678"
magenta = "#8f3f71"
cyan    = "#427b58"
white   = "#928374"
