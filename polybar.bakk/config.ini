[global/wm]
include-file = $HOME/.config/polybar/colors.ini
include-file = $HOME/.config/polybar/modules.ini

[bar/top]
; Fix: Auto-detect monitor for VMware
monitor = 
tray-position = right
tray-padding = 5
width = 98%
height = 26
padding-left = 1
padding-right = 0
background = ${colors.background}
foreground = ${colors.foreground}
bottom = false
border-top-size = 7
border-bottom-size = 7
border-top-color = ${colors.background}
border-bottom-color = ${colors.background}
offset-x = 1%
offset-y = 0.5%
fixed-center = true
line-size = 3

; Fix: If the bar disappears behind windows, set this to true
override-redirect = false 

wm-restack = bspwm

modules-left = filesystem round-left bspwm round-right 
modules-center = round-left spotify spotify-prev spotify-play-pause spotify-next round-right 
; Removed 'temperature' if it causes issues in VM
modules-right = alsa battery space round-left cpu round-right mem wlan round-left time round-right powermenu


font-0 = "JetBrainsMono Nerd Font:style=Bold:pixelsize=13;3"
font-1 = "JetBrainsMono Nerd Font:size=18;5"
font-2 = "Material\-Design\-Iconic\-Font:style=Design-Iconic-Font:size=13;3"
font-3 = "JetBrainsMono Nerd Font Mono:size=13;3"
